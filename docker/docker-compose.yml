# End-user Docker workflow for the aginiti-redteam CLI -- run everything
# (the practice target agent AND the attacks/scans) with zero local Python,
# pip, or venv at all.
#
# Pulls the prebuilt public image from GitHub Container Registry (ghcr.io).
# No repo clone or Docker build required.
#
# Usage (run in any directory containing this docker-compose.yml):
#
#   1. Download compose file:
#      curl -O https://raw.githubusercontent.com/dev-devneuron/aginiti-redteam/main/docker/docker-compose.yml
#
#   2. (Optional) Set your API key in a local .env:
#      echo 'GROQ_API_KEY="gsk_..."' > .env
#
#   3. Start the practice target:
#      docker compose up -d
#
#   4. Run scan against demo target:
#      docker compose run --rm cli aginiti scan --target http://demo-target:8001 --tier full_assessment --budget 30
#
#   5. Or run scan against your own live agent:
#      docker compose run --rm cli aginiti scan --target https://your-agent.example.com/api/chat
#
#   6. Stop practice target when finished:
#      docker compose down

name: aginiti-redteam-cli

services:
  demo-target:
    image: ghcr.io/dev-devneuron/aginiti-redteam:latest
    env_file:
      - path: .env
        required: false
    command: aginiti-demo-target --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  cli:
    image: ghcr.io/dev-devneuron/aginiti-redteam:latest
    env_file:
      - path: .env
        required: false
    working_dir: /workspace
    volumes:
      - .:/workspace
    profiles: ["cli"]

