[pytest]
# 2026-08-12: added when third-party target applications (AnythingLLM, DVAA,
# damn-vulnerable-llm-agent, the MCP filesystem test server, and an
# investigated-but-unused Onyx clone) were relocated into targets/ as part
# of moving this project's infrastructure off an ephemeral C:\...\Temp\
# claude\... scratchpad. Without this, pytest's default rootdir-based
# discovery walks the WHOLE tree and picks up those other projects' own
# test suites too (e.g. targets/onyx/backend/tests/, targets/onyx/loadtest/
# tests/) -- real collection errors from missing their own dependencies,
# and module-name collisions with this project's own tests/ package.
# Aginiti's own tests all live under tests/; nothing under targets/,
# archive/, infra/, or runs*/ is ever this project's own test suite.
testpaths = tests
