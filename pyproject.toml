[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aginiti-redteam"
version = "0.3.1"
description = "Red-teaming library for enterprise agentic AI systems — data leak evaluation"
readme = "README_pypi.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Muhammad Hammad Irfan" },
    { name = "Omer Bin Dawood" },
]
requires-python = ">=3.10"
keywords = [
    "security", "red-team", "llm", "rag", "agentic-ai",
    "penetration-testing", "owasp", "data-leakage",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "litellm>=1.40",
    # openai is already a hard transitive dependency of litellm (litellm
    # normalizes every provider's errors into openai's exception hierarchy —
    # e.g. litellm.RateLimitError subclasses openai.RateLimitError). Declared
    # directly here because aginiti/attacks/dra/ikea.py imports
    # openai.APIError explicitly, as the one common base class that actually
    # covers every litellm-raised provider exception (rate limits, timeouts,
    # connection errors, ...) for graceful degradation — not to make calls
    # through it directly, which stays exclusively through litellm.
    "openai",
    # chromadb is the vector store AND the default (local, ONNX) embedding
    # provider — it pulls onnxruntime/numpy/tokenizers transitively. Do NOT add
    # onnxruntime, sentence-transformers, or torch explicitly (chromadb manages
    # its own ONNX runtime; PyTorch is never a dependency of this project).
    #
    # Native-binary troubleshooting (some Windows/older-CPU machines — do NOT
    # hard-pin these globally, they are per-machine workarounds):
    #   * onnxruntime "DLL load failed": pin `onnxruntime==1.17.0` (needs
    #     `numpy==1.26.4`, i.e. NumPy 1.x — 1.17.0 is built against NumPy 1.x).
    #   * chromadb `add()`/`query()` SIGSEGV: the 1.x Rust core can crash on
    #     such machines — pin `chromadb>=0.5,<0.6` (older Python+hnswlib core).
    "chromadb>=0.5.0",
    # numpy stays: chromadb requires it transitively and pure-python cosine
    # helpers elsewhere are unaffected. Not tied to the (removed) JSON store.
    "numpy>=1.24",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "requests>=2.31",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # ASCII-art text rendering for aginiti/operators/ascii_art_evasion.py
    # (2026-08-23, ArtPrompt technique, arXiv:2402.11753) -- the SAME
    # library the paper's own authors used ("234 different fonts filtered
    # by human using Python art library"), not a hand-rolled approximation.
    # Pure-Python, no native/binary deps, tiny (~1MB).
    "art>=6.0",
    # Resolves a real per-OS user cache directory for IKEA/SECRET/MIA's disk
    # caches (aginiti/providers/cache.py) instead of a path relative to the
    # installed package -- a pip install's site-packages/ is not reliably
    # writable and gets wiped on every reinstall/upgrade, defeating the
    # whole point of a 7-day cache. Pure-Python, no native deps, tiny.
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/dev-devneuron/aginiti-redteam"
Repository = "https://github.com/dev-devneuron/aginiti-redteam"
Documentation = "https://github.com/dev-devneuron/aginiti-redteam/tree/main/docs"
Issues = "https://github.com/dev-devneuron/aginiti-redteam/issues"

[project.scripts]
# `aginiti scan`/`attack`/`report` -- see aginiti/cli.py's own module
# docstring. A single entry point, not one alias per subcommand: matches
# how virtually every other multi-subcommand CLI (git, docker, gh, ...)
# does this, and avoids main() having to guess which subcommand was
# intended from the invoked binary name.
aginiti = "aginiti.cli:main"
# `aginiti-demo-target` -- launches the installable local target agent
# (aginiti/demo_target/, the "demo-target" extra). Its own console script,
# not routed through aginiti.cli, so `aginiti scan`/`attack`/`report`
# never transitively import chromadb's ONNX embedding function or trigger
# its first-run model download just by importing aginiti.cli.
aginiti-demo-target = "aginiti.demo_target.main:main"

[project.optional-dependencies]
# Full local dev/benchmark workflow: running the test suite PLUS the local
# reference agents (benchmarks/dev_fixtures/, benchmarks/scaled_evals/) that
# the root README's Quick Start walks through — those agents are FastAPI/
# Uvicorn apps and use Faker to generate synthetic data.
# 2026-07-2x: fastapi/uvicorn/faker moved here FROM the core `dependencies`
# list above — nothing under aginiti/ imports any of the three (verified by
# grep), they were only ever needed by benchmarks/. A bare `pip install
# aginiti-redteam` (pointing the library at your own endpoint, no local
# agents involved) no longer pulls in a full FastAPI+Uvicorn install for
# code that never runs.
dev = [
    "pytest>=8",
    "responses>=0.25",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "faker>=25",
]
# Public-dataset benchmarking layer only (benchmarks/scaled_evals/). NOT required to
# use the library — `pip install aginiti-redteam` stays lean. Install with
# `pip install -e ".[benchmarks]"`.
benchmarks = [
    "datasets>=2.19",
    "rouge-score>=0.1.2",
]
# Placeholder — cloud embeddings (Gemini/OpenAI/Mistral/...) need no extra
# package beyond litellm, which is already a hard dependency. Pass
# embed_model="gemini/..." (etc.) and the relevant provider API key.
cloud-embeddings = []
# The Adaptive-Mode / SSG orchestrator layer (integration Slice D,
# 2026-08-20, plans/integration-plan.md's namespace-map resolution item 7)
# — needed only by two specific adapters, not by the core campaign/
# planner/graph machinery itself (verified directly by grep, same
# discipline as the `dev` extra's own note above):
#   * aginiti/adapters/dvla_adapter.py — groq (direct exception types,
#     not routed through providers.llm — this adapter drives a real
#     LangChain agent simulating the TARGET's own reasoning, a genuinely
#     different use than our own LLM calls), langchain, langchain-groq,
#     langchain-community
#   * aginiti/adapters/mcp_stdio_adapter.py — mcp
# flask is NOT listed here: it was needed only by
# aginiti/target_hardening/gateway_server.py, which moved to
# benchmarks/target_hardening/ (a benchmark fixture, not shipped in the
# wheel at all — see benchmarks/target_hardening/README.md) as part of
# the open-source-readiness directory reorg. Anyone running that fixture
# locally installs flask via requirements.txt (the full dev environment
# file), same as every other benchmarks/ fixture's runtime deps.
# Deliberately does NOT include google-genai: the plan doc's original
# item 7 listed it, but it was only ever pulled in by the hand-rolled
# Gemini translation shim (aginiti/gemini_client.py) that Slice B's
# LiteLLM-unification pass deleted outright on 2026-08-20 — nothing under
# aginiti/ imports google.genai anymore (verified by grep), so declaring
# it here would be exactly the "declared nowhere, installed by accident"
# anti-pattern requirements.txt's own header already warns against.
# Flagged as a deviation from the plan doc's literal list, not a silent
# drop.
adaptive = [
    "groq>=0.37.1",
    "langchain>=1.0.2",
    "langchain-groq>=1.1.3",
    "langchain-community>=0.4",
    "mcp>=2.0.0",
]
# A minimal, installable local target to red-team without cloning the repo
# or standing up your own agent -- `pip install aginiti-redteam[demo-target]`
# then `aginiti-demo-target` (aginiti/demo_target/, its own console script
# below). Adapted from benchmarks/dev_fixtures/agents/reference_agent_blackbox
# (a git-clone-only dev fixture) so it ships in the wheel instead. Kept as
# its own extra, not folded into `dev`: `dev` is the contributor test
# environment (pytest et al.), this is an end-user convenience with a
# narrower, FastAPI/ChromaDB-serving dependency set.
demo-target = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["."]
# "aginiti.*" (dotted), not "aginiti*" -- the old glob also matched any
# top-level directory whose NAME literally starts with "aginiti" as a
# plain string prefix, not just dotted submodules of the aginiti package.
# Caught live building 0.3.0: a local, gitignored scratch directory named
# aginiti-demo/ (a contributor's own test scripts, never committed) was
# being swept into the built wheel by this exact pattern. That directory
# is untracked and never reaches a real release through source control,
# but a wheel is built from the working tree, not from git -- so any
# local directory matching this glob would ship regardless of git status.
# The explicit exclude below is defense in depth on top of the narrower
# include, not a substitute for it.
include = ["aginiti", "aginiti.*"]
exclude = ["aginiti-demo*", "aginiti_demo*"]

[tool.setuptools.package-data]
# Bundled ground-truth dataset for the demo target agent
# (aginiti/demo_target/seed.py reads it as a plain file next to itself).
# Not a .py file, so setuptools won't include it in the wheel without this
# declaration.
"aginiti.demo_target" = ["*.json"]

[tool.pytest.ini_options]
# Consolidated from the standalone pytest.ini on 2026-08-20 (integration
# Slice E, plans/PLAN.md): both files declared the same testpaths, which
# pytest silently resolved by giving pytest.ini priority whenever both
# exist -- a real footgun (a future edit to this section alone would have
# done nothing) rather than a live bug, since the two had never actually
# diverged. One source of truth now; pytest.ini deleted.
#
# 2026-08-12 (original pytest.ini authorship): added when third-party
# target applications (AnythingLLM, DVAA, damn-vulnerable-llm-agent, the
# MCP filesystem test server, and an investigated-but-unused Onyx clone)
# were relocated into targets/ as part of moving this project's
# infrastructure off an ephemeral scratchpad path. Without this, pytest's
# default rootdir-based discovery walks the WHOLE tree and picks up those
# other projects' own test suites too (e.g. targets/onyx/backend/tests/,
# targets/onyx/loadtest/tests/) -- real collection errors from missing
# their own dependencies, and module-name collisions with this project's
# own tests/ package. Aginiti's own tests all live under tests/; nothing
# under targets/, archive/, infra/, or runs*/ is ever this project's own
# test suite.
testpaths = ["tests"]
